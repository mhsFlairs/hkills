    touchPinch=null;
    surface.classList.remove('is-pinching');
  }
  surface.addEventListener('touchend',endTouchPinch,{passive:true});
  surface.addEventListener('touchcancel',event=>{
    cancelQueuedZoom();stopPinching();touchCount=event.touches.length;
    ignoreClickUntil=performance.now()+400;
  },{passive:true});
  surface.addEventListener('click',event=>{
    if(performance.now()<ignoreClickUntil){event.preventDefault();event.stopPropagation()}
  },true);
  // Safari's gesture events provide a fallback for trackpads that do not send
  // Ctrl+wheel. Screen touch sequences are handled above, exactly once.
  function gesturePoint(event){
    return Number.isFinite(event.clientX)&&Number.isFinite(event.clientY)?{x:event.clientX,y:event.clientY}:visibleCenter();
  }
  surface.addEventListener('gesturestart',event=>{
    if(event.cancelable) event.preventDefault();
    if(touchCount||performance.now()<lastWheelUntil) return;
    const point=gesturePoint(event);
    safariPinch={scale:Number.isFinite(event.scale)&&event.scale>0?event.scale:1,anchor:pointInDiagram(point)};
  },{passive:false});
  surface.addEventListener('gesturechange',event=>{
    if(event.cancelable) event.preventDefault();
    if(!safariPinch||touchCount||!Number.isFinite(event.scale)||event.scale<=0) return;
    queueZoomAt((queuedZoom?.value??zoom)*event.scale/safariPinch.scale,gesturePoint(event),safariPinch.anchor);
    safariPinch.scale=event.scale;
  },{passive:false});
  surface.addEventListener('gestureend',event=>{
    if(event.cancelable) event.preventDefault();
    if(safariPinch) lastSafariUntil=performance.now()+180;
    safariPinch=null;
  },{passive:false});
  window.addEventListener('blur',()=>{cancelQueuedZoom();stopPinching()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelQueuedZoom();stopPinching()}});


 render();
})();
</script></body></html>
