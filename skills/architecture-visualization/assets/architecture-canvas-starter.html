    document.querySelectorAll('[data-layer]').forEach(node=>node.toggleAttribute('hidden',selectedView==='strategy'||!enabledLayers.has(node.getAttribute('data-layer'))));
    document.querySelectorAll('[data-layer-toggle]').forEach(button=>{const name=button.getAttribute('data-layer-toggle');button.setAttribute('aria-pressed',String(enabledLayers.has(name)));button.disabled=selectedView==='strategy'});
  }
  function setRoute(view,layers,{replace=false}={}){
    if(!Object.hasOwn(profiles,view)) return;
    enabledLayers=new Set([...layers].filter(name=>availableLayers.has(name)));
    const hash=routeHash(view,enabledLayers);
    if(window.location.hash!==hash)window.history[replace?'replaceState':'pushState'](null,'',hash);
    selectView(view);applyLayers();
  }
  function navigate(view){setRoute(view,enabledLayers)}
  function syncHash(){const route=readHash();setRoute(route.view,route.layers,{replace:true})}
  document.querySelectorAll('[data-view-button]').forEach(button=>{const activate=()=>navigate(button.getAttribute('data-view-button'));button.addEventListener('click',activate);button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate()}})});
  document.querySelectorAll('[data-layer-toggle]').forEach(button=>button.addEventListener('click',()=>{const name=button.getAttribute('data-layer-toggle'),next=new Set(enabledLayers);if(next.has(name))next.delete(name);else next.add(name);setRoute(selectedView,next)}));
  let focused=null;
  function focusBranch(id){
    focused=Object.hasOwn(names,id)?id:null;
    map.setAttribute('data-has-focus',String(Boolean(focused)));
    document.querySelectorAll('[data-map-branch]').forEach(branch=>branch.setAttribute('data-active',String(branch.getAttribute('data-map-branch')===focused)));
    document.querySelectorAll('[data-strategy-function]').forEach(button=>button.setAttribute('aria-pressed',String(button.getAttribute('data-strategy-function')===focused)));
    document.getElementById('strategy-focus-label').textContent=focused?names[focused]:'Select a function to highlight its branch.';
  }
  document.querySelectorAll('[data-strategy-function]').forEach(button=>{const activate=()=>{const id=button.getAttribute('data-strategy-function');focusBranch(focused===id?null:id)};button.addEventListener('click',activate);button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate()}})});
  document.getElementById('map-clear').addEventListener('click',()=>focusBranch(null));
  document.querySelectorAll('[data-map-reset]').forEach(button=>{button.addEventListener('click',()=>focusBranch(null));button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();focusBranch(null)}})});
  viewSelect.addEventListener('change',()=>navigate(viewSelect.value));
  window.addEventListener('hashchange',syncHash);window.addEventListener('popstate',syncHash);
  syncHash();
})();
</script></body></html>
