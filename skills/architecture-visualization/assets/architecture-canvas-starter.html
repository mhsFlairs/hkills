<div class="zoom-controls" role="group" aria-label="Canvas zoom controls">
  <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
  <button type="button" id="zoom-reset" class="zoom-value" aria-label="Fit diagram to screen" title="Fit diagram to screen">Fit</button>
  <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
</div>
<script>
(()=>{
  const minimum=10,maximum=200,step=25;
  let zoom=100,fitMode=true;
  const out=document.getElementById('zoom-out');
  const inside=document.getElementById('zoom-in');
  const reset=document.getElementById('zoom-reset');
  function baseWidth(){return Math.min(2200,Math.max(1770,window.innerWidth-80))}
  function fitZoom(){
    const availableWidth=Math.max(1,window.innerWidth-84);
    const availableHeight=Math.max(1,window.innerHeight-94);
    return Math.min(100,availableWidth/baseWidth()*100,availableHeight*(2150/1020)/baseWidth()*100);
  }
  function render(){
    if(fitMode) zoom=fitZoom();
    document.documentElement.style.setProperty('--diagram-width',(baseWidth()*zoom/100)+'px');
    reset.textContent=Math.round(zoom)+'%';
    reset.setAttribute('aria-label','Zoom '+Math.round(zoom)+' percent. Fit diagram to screen');
    out.disabled=zoom<=minimum;
    inside.disabled=zoom>=maximum;
  }
  out.addEventListener('click',()=>{fitMode=false;zoom=Math.max(minimum,zoom-step);render()});
  inside.addEventListener('click',()=>{fitMode=false;zoom=Math.min(maximum,zoom+step);render()});
  reset.addEventListener('click',()=>{fitMode=true;render()});
  window.addEventListener('resize',render);
  render();
})();
</script></body></html>
