<div class="zoom-controls" role="group" aria-label="Canvas zoom controls"><button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button><button type="button" id="zoom-reset" class="zoom-value" aria-label="Fit diagram to screen" title="Fit diagram to screen">Fit</button><button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button></div>
<script>
(()=>{
  const sizes={overview:[2000,940],application:[2900,940],analysis:[2280,940]};
  const titles={overview:'From sources to usable data',application:'An application connected to the existing system',analysis:'Compact parallel agents and shared results'};
  let selected='overview',zoom=100,fitMode=true;
  const minimum=10,maximum=200,step=25;
  const byId=id=>document.getElementById(id);
  const baseWidth=()=>Math.min(2900,Math.max(1700,window.innerWidth-80));
  function render(){
    const [width,height]=sizes[selected];
    if(fitMode) zoom=Math.min(100,Math.max(1,window.innerWidth-84)/baseWidth()*100,Math.max(1,window.innerHeight-94)/(height/width)/baseWidth()*100);
    document.documentElement.style.setProperty('--diagram-width',(baseWidth()*zoom/100)+'px');
    byId('zoom-reset').textContent=Math.round(zoom)+'%';
    byId('zoom-reset').setAttribute('aria-label','Zoom '+Math.round(zoom)+' percent. Fit to screen');
    byId('zoom-out').disabled=zoom<=minimum;byId('zoom-in').disabled=zoom>=maximum;
  }
  function selectView(name){
    if(!sizes[name]) return;
    selected=name;
    const [width,height]=sizes[name];
    byId('canvas').setAttribute('viewBox','0 0 '+width+' '+height);
    byId('page-bg').setAttribute('width',String(width));byId('page-bg').setAttribute('height',String(height));
    for(const id of ['canvas-bg','canvas-dots']) byId(id).setAttribute('width',String(width-80));
    byId('header-right').setAttribute('transform','translate('+(width-2000)+' 0)');
    byId('header-divider').setAttribute('x2',String(width-70));
    byId('canvas-title').textContent=titles[name];
    byId('footer-marker').setAttribute('x',String(width-200));byId('footer-marker').textContent='EXAMPLE / '+name.toUpperCase();
    byId('scene-overview').toggleAttribute('hidden',name==='analysis');
    byId('scene-application').toggleAttribute('hidden',name!=='application');
    byId('scene-analysis').toggleAttribute('hidden',name!=='analysis');
    document.querySelectorAll('[data-view-button]').forEach(button=>{const active=button.getAttribute('data-view-button')===name;button.setAttribute('data-active',String(active));button.setAttribute('aria-pressed',String(active))});
    render();
  }
  function readHash(){const name=window.location.hash.slice(1).toLowerCase();return sizes[name]?name:'overview'}
  function navigate(name){if(!sizes[name])return;if(window.location.hash!=='#'+name)window.history.pushState(null,'','#'+name);selectView(name)}
  function syncHash(){const name=readHash();if(name!==selected)selectView(name)}
  document.querySelectorAll('[data-view-button]').forEach(button=>{const activate=()=>navigate(button.getAttribute('data-view-button'));button.addEventListener('click',activate);button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate()}})});
  byId('zoom-out').addEventListener('click',()=>{fitMode=false;zoom=Math.max(minimum,zoom-step);render()});
  byId('zoom-in').addEventListener('click',()=>{fitMode=false;zoom=Math.min(maximum,zoom+step);render()});
  byId('zoom-reset').addEventListener('click',()=>{fitMode=true;render()});
  window.addEventListener('resize',render);window.addEventListener('hashchange',syncHash);window.addEventListener('popstate',syncHash);
  const initial=readHash();if(window.location.hash!=='#'+initial)window.history.replaceState(null,'','#'+initial);selectView(initial);
})();
</script></body></html>
